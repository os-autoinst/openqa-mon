---

name: openqa-mon
'on': [push, pull_request]

jobs:
  openqa-mon:
    name: openqa-mon
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with: &goversion
          go-version: '1.25'
      - name: Install requirements
        run: go mod download
      - name: Build openqa-mon
        run: make openqa-mon

  openqa-mq:
    name: openqa-mq
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with: *goversion
      - name: Install requirements
        run: go mod download
      - name: Build openqa-mq
        run: make openqa-mq

  openqa-revtui:
    name: openqa-revtui
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: Setup go
        uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with: *goversion
      - name: Install requirements
        run: go mod download
      - name: Build openqa-review
        run: make openqa-revtui

  tomllint:
    name: "Linting _review files"
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 'Checkout'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
      - name: 'Tomllint'
        uses: uncenter/setup-taplo@b18c8c8302695fe63d6853bc004006215ac52b91  # v2
      - run: taplo fmt --check _review/*.toml

